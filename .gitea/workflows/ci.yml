name: Python CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.9"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: |
          uv run ruff check
          uv run ruff format --check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.9"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Tests
        run: uv run pytest -v --cov=. --cov-report=xml

      - name: Upload coverage to Codecov
        run: >
          uvx --from codecov-cli codecovcli upload-process
          --git-service gitlab --slug rogs/caldav2google
          --file coverage.xml --token "$CODECOV_TOKEN"
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
